name: Site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify every photo URL resolves
        run: npm run check:images
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Fable/
          SITE_URL: https://darkstarnews.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploys to GitHub Pages from the default branch (enable Pages with
    # source "GitHub Actions" in the repo settings first).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
